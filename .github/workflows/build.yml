name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build, lint and test
        run: ./gradlew lint test assembleDebug assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    name: Publish release APK
    # Only for tags like v0.6.9. Signing happens when the repository has the
    # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets
    # configured; otherwise the unsigned release APK is published as-is.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Set up Android build tools
        run: yes | sdkmanager "build-tools;35.0.0" > /dev/null

      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 apk/release/app-release-unsigned.apk apk/release/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "apk/dns66-$VERSION.apk" \
            apk/release/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "apk/dns66-$VERSION.apk"
          echo "RELEASE_APK=dns66-$VERSION.apk" >> "$GITHUB_ENV"

      - name: Publish unsigned APK when no signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp apk/release/app-release-unsigned.apk "apk/dns66-$VERSION-unsigned.apk"
          echo "RELEASE_APK=dns66-$VERSION-unsigned.apk" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            apk/${{ env.RELEASE_APK }}
            apk/debug/app-debug.apk
